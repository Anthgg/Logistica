[project]
name = "continuous-authentication-backend"
version = "0.9.8"
description = "Base del backend para el proyecto de autenticación continua"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
