name: Production Deployment Pipeline

# Despliegue productivo del backend (Fase 005.3).
#
# Fuente canónica de despliegue: `staging-deploy.yml` está desactivado porque no
# existe entorno de staging, y `cd.yml` se retiró por duplicar este flujo.
#
# Construye desde el commit indicado, resuelve el digest inmutable de la imagen y
# despliega Cloud Run con los secretos por referencia a Secret Manager. Ningún valor
# secreto pasa por la línea de comandos, por las salidas del workflow ni por los logs.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'SHA de main a desplegar (vacío = el SHA de esta ejecución)'
        required: false
        type: string
      promote_traffic:
        description: 'Enviar el 100% del tráfico a la revisión nueva tras verificarla'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0356667380
  GCP_REGION: southamerica-west1
  SERVICE_NAME: autenticacion-continua-api
  ARTIFACT_REPO: cloud-run-source-deploy
  RUNTIME_SERVICE_ACCOUNT: 177686674468-compute@developer.gserviceaccount.com

# Dos despliegues simultáneos sobre el mismo servicio se pisan las revisiones.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Cloud Run (production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve target commit
        id: target
        run: |
          set -euo pipefail
          SHA="${{ inputs.commit_sha }}"
          if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      # Sin continue-on-error: si la autenticación falla no se construye ni se
      # despliega nada. Continuar tras un fallo de credenciales solo produce un verde
      # que no significa nada.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Record current production revision
        id: before
        run: |
          set -euo pipefail
          PREV="$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(status.traffic[0].revisionName)')"
          echo "revision=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Revisión actual (destino de rollback): ${PREV}"

      - name: Build and push image
        id: build
        run: |
          set -euo pipefail
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.target.outputs.short }}"
          gcloud builds submit backend \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --tag="$IMAGE" \
            --timeout=1800s
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST="$(gcloud artifacts docker images describe "${{ steps.build.outputs.image }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format='value(image_summary.digest)')"
          BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}"
          echo "ref=${BASE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Digest: ${DIGEST}"

      # Los secretos van por referencia a Secret Manager. Nunca --set-env-vars con el
      # valor: eso acabaría en el historial de comandos y en los logs de la ejecución.
      - name: Deploy new revision (no traffic)
        id: deploy
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --image="${{ steps.digest.outputs.ref }}" \
            --service-account="${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --revision-suffix="sha-${{ steps.target.outputs.short }}" \
            --set-secrets="DATABASE_URL=DATABASE_URL_PRODUCTION:latest,SECRET_KEY=SECRET_KEY_PRODUCTION:latest" \
            --set-env-vars="APP_ENV=production,COOKIE_SECURE=true,RUN_MIGRATIONS=false,FRONTEND_URL=${{ vars.PRODUCTION_FRONTEND_URL }}" \
            --no-traffic \
            --quiet

          REV="$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(status.latestCreatedRevisionName)')"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"

      - name: Verify revision is ready
        run: |
          set -euo pipefail
          READY="$(gcloud run revisions describe "${{ steps.deploy.outputs.revision }}" \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(status.conditions.filter("type:Ready").extract("status"))' | tr -d "[]'")"
          echo "Ready=${READY}"
          if [ "$READY" != "True" ]; then
            echo "FAIL: la revisión no quedó lista." >&2
            exit 1
          fi

      # La revisión se prueba por su URL con tag antes de recibir tráfico: una
      # revisión que arranca no es lo mismo que una revisión que funciona.
      - name: Health check on the new revision
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')"
          CODE="$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 "${URL}/health")"
          echo "health=${CODE}"
          cat /tmp/health.json
          if [ "$CODE" != "200" ]; then
            echo "FAIL: health devolvió ${CODE}." >&2
            exit 1
          fi

      - name: Promote traffic
        if: ${{ inputs.promote_traffic }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --to-revisions="${{ steps.deploy.outputs.revision }}=100" \
            --quiet

      - name: Verify production after promotion
        if: ${{ inputs.promote_traffic }}
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')"

          for path in /health /api/logistics/catalogs/countries; do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${URL}${path}")"
            echo "${path} -> ${CODE}"
            case "${path}:${CODE}" in
              /health:200) ;;
              # Los catálogos exigen sesión: 401 demuestra que la ruta existe, que es
              # justo lo que verifica este despliegue. Un 404 significaría que la
              # imagen no trae el código nuevo.
              /api/logistics/catalogs/countries:200|/api/logistics/catalogs/countries:401) ;;
              *) echo "FAIL: ${path} devolvió ${CODE}." >&2; exit 1 ;;
            esac
          done

      - name: Rollback traffic on failure
        if: failure() && steps.before.outputs.revision != ''
        run: |
          set -euo pipefail
          echo "Revirtiendo tráfico a ${{ steps.before.outputs.revision }}"
          gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --to-revisions="${{ steps.before.outputs.revision }}=100" \
            --quiet

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Despliegue de producción"
            echo ""
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| Commit | ${{ steps.target.outputs.sha }} |"
            echo "| Imagen | ${{ steps.build.outputs.image }} |"
            echo "| Digest | ${{ steps.digest.outputs.digest }} |"
            echo "| Revisión nueva | ${{ steps.deploy.outputs.revision }} |"
            echo "| Revisión anterior | ${{ steps.before.outputs.revision }} |"
            echo "| Tráfico promovido | ${{ inputs.promote_traffic }} |"
          } >> "$GITHUB_STEP_SUMMARY"
