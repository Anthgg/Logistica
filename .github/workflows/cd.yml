name: CD Delivery Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging (Cloud Run)
    if: github.ref == 'refs/heads/develop' || inputs.target_environment == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}
        continue-on-error: true

      - name: Deploy to Cloud Run (Staging)
        run: |
          echo "Simulated Staging Deployment - Google Cloud Run"
          echo "Service: proyecto-t1-api-staging"
          echo "Image: southamerica-west1-docker.pkg.dev/project/repo/api:${{ github.sha }}"

  deploy-production:
    name: Deploy to Production (Gated Approval)
    if: inputs.target_environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Manual Approval Gate
        run: |
          echo "Production deployment requires manual environment approval."
          echo "Validating backup & pre-flight checklist..."

      - name: Simulated Production Release
        run: |
          echo "Deploying release to production Cloud Run service [autenticacion-continua-api]..."
