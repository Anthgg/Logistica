name: CI Pipeline

on:
  push:
    branches: [ main, develop, feat/phase-045-inventory-balances ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate Phase 045
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: continuous_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d continuous_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    env:
      APP_ENV: testing
      CI: true
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
      SECRET_KEY: test-only-secret-key-must-be-min-32-chars-long
      COOKIE_SECURE: false
      SQLITE_FALLBACK_BLOCKED: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx psycopg[binary]

      # -----------------------------------------------------------------------
      # GUARD: verificar que TEST_DATABASE_URL es PostgreSQL (no SQLite)
      # -----------------------------------------------------------------------
      - name: Guard — Verify PostgreSQL DATABASE_URL
        run: |
          if [[ "$TEST_DATABASE_URL" != postgresql* ]]; then
            echo "FAIL: TEST_DATABASE_URL no apunta a PostgreSQL."
            echo "TEST_DATABASE_URL=$TEST_DATABASE_URL"
            echo "Los tests de integracion requieren PostgreSQL real."
            exit 1
          fi
          echo "PASS: TEST_DATABASE_URL es PostgreSQL: ${TEST_DATABASE_URL:0:50}..."

      # -----------------------------------------------------------------------
      # GUARD: verificar que PostgreSQL está up antes de Alembic
      # -----------------------------------------------------------------------
      - name: Guard — Wait for PostgreSQL Ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d continuous_auth_test; then
              echo "PostgreSQL is ready."
              break
            fi
            echo "Waiting for PostgreSQL... attempt $i/30"
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U postgres -d continuous_auth_test || exit 1

      # -----------------------------------------------------------------------
      # ALEMBIC: Migrations BEFORE tests
      # -----------------------------------------------------------------------
      - name: Run Alembic Upgrade to Head
        working-directory: backend
        run: |
          python -m alembic upgrade head
          echo "Alembic upgrade head: DONE"

      - name: Validate Alembic Current Head
        working-directory: backend
        run: |
          CURRENT=$(python -m alembic current 2>&1)
          echo "Alembic current: $CURRENT"
          # La cabeza esperada avanza con cada migración real. La cadena vigente
          # es gi450410045dk -> gj450510045vr -> hj460110046dk -> ik470110047dk
          # (F004.5: tablas canónicas de UBIGEO y normalización de sedes).
          if ! echo "$CURRENT" | grep -q "jl480110048dk\|ik470110047dk\|hj460110046dk\|gj450510045vr\|gi450410045dk\|gh450310045pu\|gg450210045sw\|hh450110045dc"; then
            echo "FAIL: Alembic current no muestra la cabeza esperada."
            echo "Expected: jl480110048dk (o revisiones anteriores conocidas)"
            echo "Got: $CURRENT"
            exit 1
          fi
          echo "PASS: Alembic current está en la cabeza esperada."

      # -----------------------------------------------------------------------
      # LINT
      # -----------------------------------------------------------------------
      - name: Run Linter (Ruff)
        working-directory: backend
        run: |
          ruff check app/modules/logistics/inventory/balances tests/logistics/inventory/balances --output-format=github

      # -----------------------------------------------------------------------
      # UNIT & HTTP TESTS (no PostgreSQL dependency)
      # -----------------------------------------------------------------------
      - name: Run Unit Tests
        working-directory: backend
        run: |
          pytest tests/logistics/inventory/balances -m "unit" --tb=short -v
          echo "Unit tests: DONE"

      - name: Run Security/HTTP Tests
        working-directory: backend
        run: |
          pytest tests/logistics/inventory/balances -m "security" --tb=short -v
          echo "Security tests: DONE"

      # -----------------------------------------------------------------------
      # DOCUMENTS — regresión HTTP del listado y del historial
      #
      # Corre contra el PostgreSQL del job, no contra SQLite, y no mockea el
      # servicio: el fallo que cubre estaba en la comprobación de tenant del
      # router, no en la consulta.
      #
      # Los pasos de lint de este workflow enumeran rutas concretas, así que el
      # fichero se linta aquí de forma explícita en vez de ampliar Ruff a todo
      # el repositorio.
      # -----------------------------------------------------------------------
      - name: Lint Documents Regression Tests
        working-directory: backend
        run: |
          # El router arrastra hallazgos de Ruff anteriores a este hotfix
          # (imports sin usar y sin ordenar). Lintarlo aquí haría fallar el
          # gate por deuda ajena al cambio, así que se limita a los tests.
          ruff check \
            tests/test_logistics_documents_history_http.py \
            tests/test_logistics_documents_list_http.py \
            tests/test_logistics_documents_pdf_http.py \
            --output-format=github

      - name: Compile Documents Production Modules
        working-directory: backend
        run: |
          # El router y el servicio arrastran hallazgos de Ruff anteriores a
          # este hotfix, asi que no se lintan aqui; pero un modulo productivo
          # tocado no debe quedar sin ninguna comprobacion.
          python -m py_compile \
            app/modules/logistics/documents/api/router.py \
            app/modules/logistics/documents/application/lifecycle_service.py

      - name: Run Documents HTTP Regression Tests (list + history + pdf)
        working-directory: backend
        run: |
          set +e
          pytest \
            tests/test_logistics_documents_history_http.py \
            tests/test_logistics_documents_list_http.py \
            tests/test_logistics_documents_pdf_http.py \
            --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_history.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_history.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_history.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_history.log | tail -1 || true)

          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "DOCUMENTS HTTP REGRESSION SUMMARY (list + history + pdf)"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la regresión HTTP de Documents terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED test(s) de la regresión HTTP de Documents fallaron."
            exit 1
          fi
          # Un skip aquí significa que el gate no protegió nada.
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $SKIPPED test(s) de la regresión HTTP de Documents fueron SKIPPED."
            exit 1
          fi
          if [ "$PASSED" -lt 16 ]; then
            echo "FAIL: se esperaban al menos 16 casos y se ejecutaron $PASSED."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # F004 — ESTRUCTURA ORGANIZACIONAL (organization / branch / warehouse)
      # -----------------------------------------------------------------------
      - name: Lint F004 Organization Structure Modules
        working-directory: backend
        run: |
          ruff check \
            app/modules/logistics/organization/scope.py \
            app/modules/logistics/organization/api/router.py \
            app/modules/logistics/organization/service.py \
            app/modules/logistics/organization/repository.py \
            tests/test_logistics_f004_structure_http.py \
            --output-format=github

      - name: Run F004 Organization Structure HTTP Regression Tests
        working-directory: backend
        run: |
          set +e
          pytest \
            tests/test_logistics_f004_structure_http.py \
            tests/test_logistics_phase004.py \
            --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_f004.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_f004.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_f004.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_f004.log | tail -1 || true)

          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "F004 ORGANIZATION STRUCTURE SUMMARY"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la regresión F004 terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED test(s) de la regresión F004 fallaron."
            exit 1
          fi
          # Un skip aquí significa que el gate no protegió nada.
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $SKIPPED test(s) de la regresión F004 fueron SKIPPED."
            exit 1
          fi
          if [ "$PASSED" -lt 60 ]; then
            echo "FAIL: se esperaban al menos 60 casos y se ejecutaron $PASSED."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # F004.5 — UBIGEO Y NORMALIZACIÓN GEOGRÁFICA
      # -----------------------------------------------------------------------
      - name: Lint F004.5 Geography & UBIGEO Modules
        working-directory: backend
        run: |
          ruff check \
            app/modules/logistics/geography/models.py \
            app/modules/logistics/geography/schemas.py \
            app/modules/logistics/geography/service.py \
            app/modules/logistics/geography/router.py \
            tests/test_logistics_geography.py \
            tests/test_logistics_branch_ubigeo.py \
            --output-format=github

      - name: Run F004.5 Geography & UBIGEO Tests
        working-directory: backend
        run: |
          set +e
          pytest \
            tests/test_logistics_geography.py \
            tests/test_logistics_branch_ubigeo.py \
            --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_f004_5.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_f004_5.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_f004_5.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_f004_5.log | tail -1 || true)

          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "F004.5 GEOGRAPHY & UBIGEO SUMMARY"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la suite F004.5 terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED test(s) de F004.5 fallaron."
            exit 1
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $SKIPPED test(s) de F004.5 fueron SKIPPED."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # POSTGRESQL INTEGRATION TESTS — SKIP=0 requerido
      # -----------------------------------------------------------------------
      - name: Run PostgreSQL Integration Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/logistics/inventory/balances -m "postgres" --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_postgres.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_postgres.log

          # Anti-skip check: en CI, SKIP de tests postgres = ERROR
          SKIPPED=$(grep -c "SKIPPED\|SKIP" /tmp/pytest_postgres.log || true)
          PASSED=$(grep -c "PASSED" /tmp/pytest_postgres.log || true)
          FAILED=$(grep -c "FAILED" /tmp/pytest_postgres.log || true)
          SKIPPED=${SKIPPED:-0}
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          echo "PostgreSQL Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: pytest terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.postgres fueron SKIPPED en CI."
            echo "SKIP=0 es requerido en CI. Revisar conftest.py y TEST_DATABASE_URL."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.postgres fallaron."
            exit 1
          fi
          echo "PASS: Todos los tests PostgreSQL pasaron sin SKIP."

      - name: Run Concurrency Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/logistics/inventory/balances -m "concurrency" --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_concurrency.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_concurrency.log

          SKIPPED=$(grep -c "SKIPPED\|SKIP" /tmp/pytest_concurrency.log || true)
          PASSED=$(grep -c "PASSED" /tmp/pytest_concurrency.log || true)
          FAILED=$(grep -c "FAILED" /tmp/pytest_concurrency.log || true)
          SKIPPED=${SKIPPED:-0}
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          echo "Concurrency Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: pytest terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.concurrency fueron SKIPPED en CI."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.concurrency fallaron."
            exit 1
          fi
          echo "PASS: Todos los tests de concurrencia pasaron sin SKIP."

      - name: Run Migration Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/logistics/inventory/balances -m "migration" --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_migration.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_migration.log

          SKIPPED=$(grep -c "SKIPPED\|SKIP" /tmp/pytest_migration.log || true)
          PASSED=$(grep -c "PASSED" /tmp/pytest_migration.log || true)
          FAILED=$(grep -c "FAILED" /tmp/pytest_migration.log || true)
          SKIPPED=${SKIPPED:-0}
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          echo "Migration Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: pytest terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.migration fueron SKIPPED en CI."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.migration fallaron."
            exit 1
          fi
          echo "PASS: Todos los tests de migracion pasaron sin SKIP."

      # -----------------------------------------------------------------------
      # FULL PHASE 045 SUITE
      # -----------------------------------------------------------------------
      - name: Run Full Phase 045 Test Suite
        working-directory: backend
        run: |
          pytest tests/logistics/inventory/balances -vv --tb=short -p no:cacheprovider

      # -----------------------------------------------------------------------
      # INVENTORY BALANCES & LEDGER (Phase 044 & 045)
      #
      # No es la suite backend completa: cubre balances y ledger. El nombre
      # anterior, "Full Backend Suite", hacía creer que cualquier test del
      # backend estaba protegido aquí, y no lo estaba.
      # -----------------------------------------------------------------------
      - name: Run Inventory Balances & Ledger Regression Suite
        working-directory: backend
        run: |
          set +e
          pytest tests/logistics/inventory/balances tests/modules/logistics/inventory/ledger/ -m "not ml" --tb=short -p no:cacheprovider 2>&1 | tee /tmp/pytest_full.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_full.log

          # Robust report parser
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_full.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_full.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_full.log | tail -1 || true)

          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "INVENTORY BALANCES & LEDGER SUMMARY"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la suite de balances y ledger terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: la suite de balances y ledger tiene $FAILED test(s) fallido(s)."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # PDF DOWNLOAD HARDENING — lint, tests and contract gate
      # -----------------------------------------------------------------------
      - name: Run Linter (Ruff) — PDF modules
        working-directory: backend
        run: |
          ruff check \
            app/core/pdf_response.py \
            app/modules/logistics/documents/rendering/filenames.py \
            tests/test_pdf_download_response.py \
            tests/test_pdf_download_http.py \
            tests/test_pdf_download_audit.py \
            tests/test_pdf_download_audit_postgres.py \
            tests/test_pdf_signature_layout.py \
            scripts/audit_pdf_downloads.py \
            --output-format=github

      - name: Run PDF Download Tests
        working-directory: backend
        run: |
          set +e
          pytest \
            tests/test_pdf_download_response.py \
            tests/test_pdf_download_http.py \
            tests/test_pdf_download_audit.py \
            tests/test_pdf_signature_layout.py \
            --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_pdf.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_pdf.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_pdf.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_pdf.log | tail -1 || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "PDF DOWNLOAD SUITE"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: PDF suite terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED test(s) PDF fallido(s)."
            exit 1
          fi
          # Un PDF test saltado esconde exactamente el tipo de regresión que
          # esta suite existe para detectar.
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $SKIPPED test(s) PDF SKIPPED. SKIP=0 es requerido."
            exit 1
          fi
          if [ "$PASSED" -lt 77 ]; then
            echo "FAIL: sólo $PASSED tests PDF ejecutados; se esperan >= 77."
            exit 1
          fi
          echo "PASS: suite PDF completa sin fallos ni skips."

      - name: Run PDF PostgreSQL Audit Integration Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/test_pdf_download_audit_postgres.py \
            -m "pdf_postgres" --tb=short -v -p no:cacheprovider \
            2>&1 | tee /tmp/pytest_pdf_postgres.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_pdf_postgres.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_pdf_postgres.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_pdf_postgres.log | tail -1 || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "PDF PostgreSQL Audit Integration Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"
          if [ "$PYTEST_EXIT" -ne 0 ]; then
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -ne 0 ] || [ "$SKIPPED" -ne 0 ]; then
            echo "FAIL: PDF PostgreSQL gate requires FAILED=0 and SKIPPED=0."
            exit 1
          fi
          if [ "$PASSED" -lt 11 ]; then
            echo "FAIL: expected at least 11 real PostgreSQL PDF tests."
            exit 1
          fi
          echo "PASS: PDF PostgreSQL audit invariants verified on the real service."

      - name: Verify PDF Download Contract (OpenAPI)
        working-directory: backend
        run: |
          # Offline: importa la app local, sin red ni credenciales.
          python scripts/audit_pdf_downloads.py --check --min-operations 33

      # -----------------------------------------------------------------------
      # AUDIT EVENTS HTTP REGRESSION GATE
      # -----------------------------------------------------------------------
      - name: Run Audit HTTP Regression Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/test_logistics_phase007.py --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_audit.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_audit.log

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_audit.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_audit.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_audit.log | tail -1 || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "Audit HTTP Regression Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"
          if [ "$PYTEST_EXIT" -ne 0 ]; then
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -ne 0 ] || [ "$SKIPPED" -ne 0 ]; then
            echo "FAIL: Audit regression gate requires FAILED=0 and SKIPPED=0."
            exit 1
          fi
          echo "PASS: Audit HTTP regression tests verified."

      # -----------------------------------------------------------------------
      # OPENAPI / IMPORT SMOKE
      # -----------------------------------------------------------------------
      - name: Verify OpenAPI Schema and Import
        working-directory: backend
        run: |
          python -c "
          import os
          os.environ.setdefault('APP_ENV', 'testing')
          from app.main import app
          schema = app.openapi()
          paths = list(schema['paths'].keys())
          base = '/api/logistics/inventory/balances'
          balance_paths = [p for p in paths if base in p]
          v1_paths = [p for p in paths if '/api/v1' in p]
          print(f'BALANCES_PATHS ({len(balance_paths)}): {balance_paths}')
          print(f'API_V1_PATHS (must be 0): {v1_paths}')
          assert len(balance_paths) > 0, f'No balance paths found in OpenAPI. All paths: {paths}'
          assert len(v1_paths) == 0, f'Found /api/v1 paths — should not exist: {v1_paths}'
          print('PASS: OpenAPI schema is correct.')
          "

      # -----------------------------------------------------------------------
      # ALEMBIC HEADS / CURRENT (final check)
      # -----------------------------------------------------------------------
      - name: Final Alembic Validation
        working-directory: backend
        run: |
          echo "=== alembic heads ==="
          python -m alembic heads
          echo "=== alembic current ==="
          python -m alembic current
          echo "=== alembic history --indicate-current ==="
          python -m alembic history --indicate-current | head -10

  docker-build:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Test Only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: backend:ci-test
