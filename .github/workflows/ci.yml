name: CI Pipeline

on:
  push:
    branches: [ main, develop, feat/phase-045-inventory-balances ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate Phase 045
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: continuous_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d continuous_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    env:
      APP_ENV: testing
      CI: true
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
      SECRET_KEY: test-only-secret-key-must-be-min-32-chars-long
      COOKIE_SECURE: false
      SQLITE_FALLBACK_BLOCKED: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx psycopg[binary]

      # -----------------------------------------------------------------------
      # GUARD: verificar que TEST_DATABASE_URL es PostgreSQL (no SQLite)
      # -----------------------------------------------------------------------
      - name: Guard — Verify PostgreSQL DATABASE_URL
        run: |
          if [[ "$TEST_DATABASE_URL" != postgresql* ]]; then
            echo "FAIL: TEST_DATABASE_URL no apunta a PostgreSQL."
            echo "TEST_DATABASE_URL=$TEST_DATABASE_URL"
            echo "Los tests de integracion requieren PostgreSQL real."
            exit 1
          fi
          echo "PASS: TEST_DATABASE_URL es PostgreSQL: ${TEST_DATABASE_URL:0:50}..."

      # -----------------------------------------------------------------------
      # GUARD: verificar que PostgreSQL está up antes de Alembic
      # -----------------------------------------------------------------------
      - name: Guard — Wait for PostgreSQL Ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d continuous_auth_test; then
              echo "PostgreSQL is ready."
              break
            fi
            echo "Waiting for PostgreSQL... attempt $i/30"
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U postgres -d continuous_auth_test || exit 1

      # -----------------------------------------------------------------------
      # ALEMBIC: Migrations BEFORE tests
      # -----------------------------------------------------------------------
      - name: Run Alembic Upgrade to Head
        working-directory: backend
        run: |
          python -m alembic upgrade head
          echo "Alembic upgrade head: DONE"

      - name: Validate Alembic Current Head
        working-directory: backend
        run: |
          CURRENT=$(python -m alembic current 2>&1)
          echo "Alembic current: $CURRENT"
          # La cabeza esperada avanza con cada migración real. La cadena vigente
          # es gi450410045dk -> gj450510045vr -> hj460110046dk -> ik470110047dk
          # -> jl480110048dk -> km490110049wh (geolocalización de almacén).
          if ! echo "$CURRENT" | grep -q "km490110049wh\|jl480110048dk\|ik470110047dk\|hj460110046dk\|gj450510045vr\|gi450410045dk\|gh450310045pu\|gg450210045sw\|hh450110045dc"; then
            echo "FAIL: Alembic current no muestra la cabeza esperada."
            echo "Expected: km490110049wh (o revisiones anteriores conocidas)"
            echo "Got: $CURRENT"
            exit 1
          fi
          echo "PASS: Alembic current está en la cabeza esperada."

      # -----------------------------------------------------------------------
      # LINT
      # -----------------------------------------------------------------------
      - name: Run Linter (Ruff)
        working-directory: backend
        run: |
          ruff check app/modules/logistics/inventory/balances tests/logistics/inventory/balances --output-format=github

      # -----------------------------------------------------------------------
      # UNIT & HTTP TESTS (no PostgreSQL dependency)
      # -----------------------------------------------------------------------
      - name: Run Unit Tests
        working-directory: backend
        run: |
          pytest tests/logistics/inventory/balances -m "unit" --tb=short -v
          echo "Unit tests: DONE"

      - name: Run Security/HTTP Tests
        working-directory: backend
        run: |
          pytest tests/logistics/inventory/balances -m "security" --tb=short -v
          echo "Security tests: DONE"

      # -----------------------------------------------------------------------
      # DOCUMENTS — regresión HTTP del listado y del historial
      #
      # Corre contra el PostgreSQL del job, no contra SQLite, y no mockea el
      # servicio: el fallo que cubre estaba en la comprobación de tenant del
      # router, no en la consulta.
      #
      # Los pasos de lint de este workflow enumeran rutas concretas, así que el
      # fichero se linta aquí de forma explícita en vez de ampliar Ruff a todo
      # el repositorio.
      # -----------------------------------------------------------------------
      - name: Lint Documents Regression Tests
        working-directory: backend
        run: |
          # El router arrastra hallazgos de Ruff anteriores a este hotfix
          # (imports sin usar y sin ordenar). Lintarlo aquí haría fallar el
          # gate por deuda ajena al cambio, así que se limita a los tests.
          ruff check \
            tests/test_logistics_documents_history_http.py \
            tests/test_logistics_documents_list_http.py \
            tests/test_logistics_documents_pdf_http.py \
            --output-format=github

      - name: Compile Documents Production Modules
        working-directory: backend
        run: |
          # El router y el servicio arrastran hallazgos de Ruff anteriores a
          # este hotfix, asi que no se lintan aqui; pero un modulo productivo
          # tocado no debe quedar sin ninguna comprobacion.
          python -m py_compile \
            app/modules/logistics/documents/api/router.py \
            app/modules/logistics/documents/application/lifecycle_service.py

      - name: Run Documents HTTP Regression Tests (list + history + pdf)
        working-directory: backend
        run: |
          set +e
          pytest \
            tests/test_logistics_documents_history_http.py \
            tests/test_logistics_documents_list_http.py \
            tests/test_logistics_documents_pdf_http.py \
            --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_history.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_history.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_history.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_history.log | tail -1 || true)

          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "DOCUMENTS HTTP REGRESSION SUMMARY (list + history + pdf)"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la regresión HTTP de Documents terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED test(s) de la regresión HTTP de Documents fallaron."
            exit 1
          fi
          # Un skip aquí significa que el gate no protegió nada.
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $SKIPPED test(s) de la regresión HTTP de Documents fueron SKIPPED."
            exit 1
          fi
          if [ "$PASSED" -lt 16 ]; then
            echo "FAIL: se esperaban al menos 16 casos y se ejecutaron $PASSED."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # F004 — ESTRUCTURA ORGANIZACIONAL (organization / branch / warehouse)
      # -----------------------------------------------------------------------
      - name: Lint F004 Organization Structure Modules
        working-directory: backend
        run: |
          ruff check \
            app/modules/logistics/organization/scope.py \
            app/modules/logistics/organization/api/router.py \
            app/modules/logistics/organization/service.py \
            app/modules/logistics/organization/repository.py \
            tests/test_logistics_f004_structure_http.py \
            --output-format=github

      - name: Run F004 Organization Structure HTTP Regression Tests
        working-directory: backend
        run: |
          set +e
          pytest \
            tests/test_logistics_f004_structure_http.py \
            tests/test_logistics_phase004.py \
            --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_f004.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_f004.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_f004.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_f004.log | tail -1 || true)

          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "F004 ORGANIZATION STRUCTURE SUMMARY"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la regresión F004 terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED test(s) de la regresión F004 fallaron."
            exit 1
          fi
          # Un skip aquí significa que el gate no protegió nada.
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $SKIPPED test(s) de la regresión F004 fueron SKIPPED."
            exit 1
          fi
          if [ "$PASSED" -lt 60 ]; then
            echo "FAIL: se esperaban al menos 60 casos y se ejecutaron $PASSED."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # WAREHOUSE GEOLOCATION — model, migration and effective-location rules
      # -----------------------------------------------------------------------
      - name: Lint Warehouse Geolocation Modules
        working-directory: backend
        run: |
          ruff check \
            alembic/versions/km490110049wh_add_warehouse_geolocation.py \
            app/models/warehouse.py \
            app/modules/logistics/organization/schemas.py \
            app/modules/logistics/organization/repository.py \
            app/modules/logistics/organization/service.py \
            app/modules/logistics/organization/api/router.py \
            tests/test_warehouse_geolocation.py \
            tests/test_logistics_f004_structure_http.py \
            --output-format=github

      - name: Run Warehouse Geolocation PostgreSQL Gate
        working-directory: backend
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/warehouse_geo_test_ci
        run: |
          PGPASSWORD=postgrespassword createdb \
            --host=localhost --port=5432 --username=postgres \
            warehouse_geo_test_ci
          DATABASE_URL="$TEST_MIGRATION_DATABASE_URL" python -m alembic upgrade head
          set +e
          pytest tests/test_warehouse_geolocation.py --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_warehouse_geo.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_warehouse_geo.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_warehouse_geo.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_warehouse_geo.log | tail -1 || true)
          PASSED=${PASSED:-0}; FAILED=${FAILED:-0}; SKIPPED=${SKIPPED:-0}

          echo "Warehouse geolocation — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"
          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: pytest terminó con código $PYTEST_EXIT."
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -ne 0 ] || [ "$SKIPPED" -ne 0 ]; then
            echo "FAIL: warehouse geolocation requires FAILED=0 and SKIPPED=0 on PostgreSQL."
            exit 1
          fi
          if [ "$PASSED" -lt 11 ]; then
            echo "FAIL: expected at least 11 warehouse geolocation tests."
            exit 1
          fi
          echo "PASS: warehouse geolocation model and migration verified on PostgreSQL."

      # -----------------------------------------------------------------------
      # F004.5 — UBIGEO Y NORMALIZACIÓN GEOGRÁFICA
      # -----------------------------------------------------------------------
      - name: Lint F004.5 Geography & UBIGEO Modules
        working-directory: backend
        run: |
          ruff check \
            app/modules/logistics/geography/models.py \
            app/modules/logistics/geography/schemas.py \
            app/modules/logistics/geography/service.py \
            app/modules/logistics/geography/router.py \
            tests/test_logistics_geography.py \
            tests/test_logistics_branch_ubigeo.py \
            --output-format=github

      - name: Run F004.5 Geography & UBIGEO Tests
        working-directory: backend
        run: |
          set +e
          pytest \
            tests/test_logistics_geography.py \
            tests/test_logistics_branch_ubigeo.py \
            --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_f004_5.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_f004_5.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_f004_5.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_f004_5.log | tail -1 || true)

          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "F004.5 GEOGRAPHY & UBIGEO SUMMARY"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la suite F004.5 terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED test(s) de F004.5 fallaron."
            exit 1
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $SKIPPED test(s) de F004.5 fueron SKIPPED."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # F005.1 — CÓDIGOS AUTOMÁTICOS, CATÁLOGOS Y GEOGRAFÍA DERIVADA
      # -----------------------------------------------------------------------
      - name: Lint F005.1 Code Generation & Catalog Modules
        working-directory: backend
        run: |
          ruff check             app/models/entity_code_counter.py             app/modules/logistics/organization/code_generator.py             app/modules/logistics/organization/reference_catalogs.py             tests/test_logistics_f0051_entity_codes_http.py             --output-format=github

      - name: Run F005.1 Entity Code & Catalog Regression Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/test_logistics_f0051_entity_codes_http.py             --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_f0051.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_f0051.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_f0051.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_f0051.log | tail -1 || true)
          PASSED=${PASSED:-0}; FAILED=${FAILED:-0}; SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "F005.1 ENTITY CODES & CATALOGS"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la regresión F005.1 terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED test(s) de la regresión F005.1 fallaron."
            exit 1
          fi
          # El test de concurrencia se salta si la base no es PostgreSQL: un skip
          # aquí significaría que el gate no protegió el bloqueo de fila.
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $SKIPPED test(s) de la regresión F005.1 fueron SKIPPED."
            exit 1
          fi
          if [ "$PASSED" -lt 20 ]; then
            echo "FAIL: se esperaban al menos 20 casos y se ejecutaron $PASSED."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # F005.2 — PIPELINE DE RELEASE DE BASE DE DATOS
      # -----------------------------------------------------------------------
      - name: Lint F005.2 Migration Release Modules
        working-directory: backend
        run: |
          ruff check \
            scripts/verify_production_schema.py \
            tests/test_database_migration_workflow.py \
            --output-format=github

      - name: Validate migration job entrypoint syntax
        working-directory: backend
        run: sh -n scripts/run_migration_job.sh

      - name: Run F005.2 Migration Workflow Guard Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/test_database_migration_workflow.py --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_f0052.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_f0052.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_f0052.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_f0052.log | tail -1 || true)
          PASSED=${PASSED:-0}; FAILED=${FAILED:-0}; SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "F005.2 DATABASE RELEASE PIPELINE"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: las guardas del workflow de migración terminaron con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $FAILED fallidos y $SKIPPED omitidos; se requiere 0 y 0."
            exit 1
          fi
          if [ "$PASSED" -lt 14 ]; then
            echo "FAIL: se esperaban al menos 14 guardas y se ejecutaron $PASSED."
            exit 1
          fi

      # Red de seguridad independiente de pytest: si alguien reintroduce el
      # placeholder o silencia la autenticación, el gate cae aquí también.
      - name: Guard — Migration workflow must execute for real
        run: |
          WF=.github/workflows/database-migration.yml

          # Los comentarios nombran ambas reglas para explicarlas; lo que se audita
          # son las líneas efectivas.
          EFFECTIVE=$(grep -vE '^[[:space:]]*#' "$WF")

          if printf '%s\n' "$EFFECTIVE" | grep -Eq 'echo[[:space:]]+["'"'"'][^"'"'"']*gcloud[[:space:]]+run[[:space:]]+jobs[[:space:]]+execute'; then
            echo "FAIL: el workflow vuelve a imprimir el comando en vez de ejecutarlo."
            exit 1
          fi
          if ! printf '%s\n' "$EFFECTIVE" | grep -q 'gcloud run jobs execute'; then
            echo "FAIL: el workflow no ejecuta el Cloud Run Job."
            exit 1
          fi
          if printf '%s\n' "$EFFECTIVE" | grep -q 'continue-on-error'; then
            echo "FAIL: el workflow de migración no puede silenciar fallos."
            exit 1
          fi
          echo "PASS: ejecución real y sin continue-on-error."

      # -----------------------------------------------------------------------
      # F005.3 — PIPELINE DE DESPLIEGUE PRODUCTIVO Y ROTACIÓN DE SECRETOS
      # -----------------------------------------------------------------------
      - name: Lint F005.3 Deployment Modules
        working-directory: backend
        run: |
          ruff check \
            scripts/scan_for_secrets.py \
            tests/test_production_deploy_workflow.py \
            tests/test_scan_for_secrets.py \
            --output-format=github

      - name: Run F005.3 Deployment Guard Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/test_production_deploy_workflow.py tests/test_scan_for_secrets.py --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_f0053.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_f0053.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_f0053.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_f0053.log | tail -1 || true)
          PASSED=${PASSED:-0}; FAILED=${FAILED:-0}; SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "F005.3 PRODUCTION DEPLOYMENT"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: las guardas de despliegue terminaron con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $FAILED fallidos y $SKIPPED omitidos; se requiere 0 y 0."
            exit 1
          fi
          if [ "$PASSED" -lt 26 ]; then
            echo "FAIL: se esperaban al menos 26 guardas y se ejecutaron $PASSED."
            exit 1
          fi

      # Red de seguridad independiente de pytest, igual que en el pipeline de
      # migraciones: si alguien reintroduce el placeholder o silencia la
      # autenticación, el gate cae también aquí.
      - name: Guard — Production deploy must be real
        run: |
          WF=.github/workflows/production-deploy.yml
          EFFECTIVE=$(grep -vE '^[[:space:]]*#' "$WF")

          if printf '%s\n' "$EFFECTIVE" | grep -Eq 'echo[[:space:]]+["'"'"'][^"'"'"']*gcloud[[:space:]]+run[[:space:]]+deploy'; then
            echo "FAIL: el despliegue vuelve a ser un echo."
            exit 1
          fi
          if ! printf '%s\n' "$EFFECTIVE" | grep -q 'gcloud run deploy'; then
            echo "FAIL: el workflow no despliega Cloud Run."
            exit 1
          fi
          if printf '%s\n' "$EFFECTIVE" | grep -q 'continue-on-error'; then
            echo "FAIL: el workflow de despliegue no puede silenciar fallos."
            exit 1
          fi
          if ! printf '%s\n' "$EFFECTIVE" | grep -q -- '--set-secrets='; then
            echo "FAIL: los secretos no se inyectan por referencia a Secret Manager."
            exit 1
          fi
          if printf '%s\n' "$EFFECTIVE" | grep -- '--set-env-vars=' | grep -Eq 'DATABASE_URL|SECRET_KEY'; then
            echo "FAIL: un secreto viaja como variable de entorno literal."
            exit 1
          fi
          if [ -f .github/workflows/cd.yml ]; then
            echo "FAIL: cd.yml duplica el pipeline de despliegue."
            exit 1
          fi
          echo "PASS: despliegue real, fail-fast y secretos por referencia."

      - name: Guard — No production secrets in deployment workflows
        working-directory: backend
        run: |
          python scripts/scan_for_secrets.py \
            ../.github/workflows/production-deploy.yml \
            ../.github/workflows/staging-deploy.yml \
            ../.github/workflows/database-migration.yml \
            ../docs/phase-005-2 \
            ../docs/phase-005-3

      # -----------------------------------------------------------------------
      # F006 HOTFIX — HASH DE CONTRASEÑA IRRECONOCIBLE
      # -----------------------------------------------------------------------
      - name: Run Auth Invalid Password Hash Regression
        working-directory: backend
        run: |
          set +e
          pytest tests/test_auth_invalid_password_hash.py --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_authhash.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_authhash.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_authhash.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_authhash.log | tail -1 || true)
          PASSED=${PASSED:-0}; FAILED=${FAILED:-0}; SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "AUTH INVALID PASSWORD HASH"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la regresión de hash inválido terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $FAILED fallidos y $SKIPPED omitidos; se requiere 0 y 0."
            exit 1
          fi
          if [ "$PASSED" -lt 19 ]; then
            echo "FAIL: se esperaban al menos 19 casos y se ejecutaron $PASSED."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # F006 PR 1 — AUTORIZACIÓN DE ENDPOINTS
      # -----------------------------------------------------------------------
      - name: Lint F006 Authorization Modules
        working-directory: backend
        run: |
          ruff check             scripts/audit_permission_coverage.py             tests/test_logistics_f006_endpoint_authorization.py             --output-format=github

      - name: Run F006 Endpoint Authorization Regression
        working-directory: backend
        run: |
          set +e
          pytest tests/test_logistics_f006_endpoint_authorization.py --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_f006.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_f006.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_f006.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_f006.log | tail -1 || true)
          PASSED=${PASSED:-0}; FAILED=${FAILED:-0}; SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "F006 ENDPOINT AUTHORIZATION"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la regresión de autorización terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $FAILED fallidos y $SKIPPED omitidos; se requiere 0 y 0."
            exit 1
          fi
          if [ "$PASSED" -lt 30 ]; then
            echo "FAIL: se esperaban al menos 30 casos y se ejecutaron $PASSED."
            exit 1
          fi

      # El auditor recorre las rutas reales e inspecciona sus dependencias. Falla si
      # reaparece un endpoint sin autenticación fuera de la lista permitida o un
      # mutador de negocio que solo pide sesión.
      - name: Guard — Endpoint authorization coverage
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/coverage-audit.db
          # pytest añade la raíz al sys.path; `python` a secas no.
          PYTHONPATH: .
        run: python scripts/audit_permission_coverage.py --check

      # Guarda del catálogo: ningún código duplicado y ninguna referencia a un permiso
      # que no exista. Una referencia fantasma deja el endpoint inalcanzable en
      # silencio, que es como el módulo de evaluaciones pasó meses sin funcionar.
      - name: Guard — Permission catalog integrity
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'GUARD'
          import collections, pathlib, re, sys
          from app.modules.logistics.rbac.permission_catalog import PERMISSIONS

          codes = [str(p["code"]) for p in PERMISSIONS]
          duplicates = sorted(c for c, n in collections.Counter(codes).items() if n > 1)
          catalog = set(codes)

          pattern = re.compile(r"require_permission\(\s*[\"']([^\"']+)[\"']")
          referenced = set()
          for file in pathlib.Path("app").rglob("*.py"):
              if "__pycache__" in str(file):
                  continue
              referenced.update(
                  m.group(1) for m in pattern.finditer(file.read_text(encoding="utf-8", errors="replace"))
              )
          unknown = sorted(referenced - catalog)

          print(f"TOTAL_PERMISSIONS             = {len(PERMISSIONS)}")
          print(f"DUPLICATE_PERMISSION_CODES    = {len(duplicates)} {duplicates}")
          print(f"UNKNOWN_PERMISSION_REFERENCES = {len(unknown)} {unknown}")
          sys.exit(1 if duplicates or unknown else 0)
          GUARD

      # -----------------------------------------------------------------------
      # F006 PR 2 — CATÁLOGO DE PERMISOS Y GATES DE AUTORIZACIÓN
      # -----------------------------------------------------------------------
      - name: Lint F006 PR2 Modules
        working-directory: backend
        run: |
          ruff check             scripts/audit_permission_catalog.py             tests/test_logistics_f006_catalog_gates.py             --output-format=github

      - name: Run F006 Catalog Gate Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/test_logistics_f006_catalog_gates.py --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_f006b.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_f006b.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_f006b.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_f006b.log | tail -1 || true)
          PASSED=${PASSED:-0}; FAILED=${FAILED:-0}; SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "F006 PERMISSION CATALOG GATES"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: las guardas del catálogo terminaron con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ] || [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $FAILED fallidos y $SKIPPED omitidos; se requiere 0 y 0."
            exit 1
          fi
          if [ "$PASSED" -lt 25 ]; then
            echo "FAIL: se esperaban al menos 25 guardas y se ejecutaron $PASSED."
            exit 1
          fi

      # Integridad del catálogo: duplicados, referencias inexistentes, metadata
      # obligatoria, convención de nombres, step-up con política, y una matriz de roles
      # que cubra exactamente los roles de sistema sin conceder permisos que no existen.
      - name: Guard — Permission catalog integrity
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python scripts/audit_permission_catalog.py --check

      # El artefacto derivado debe corresponder al catálogo actual. Si alguien lo edita
      # a mano o cambia el catálogo sin regenerarlo, deja de ser derivado.
      - name: Guard — Derived catalog artifact is current
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/audit_permission_catalog.py --export /tmp/catalog.json >/dev/null
          if ! diff -q /tmp/catalog.json ../docs/phase-006/permission_catalog.json >/dev/null; then
            echo "FAIL: docs/phase-006/permission_catalog.json no corresponde al catálogo."
            echo "Regenéralo con: python scripts/audit_permission_catalog.py --export ../docs/phase-006/permission_catalog.json"
            exit 1
          fi
          echo "PASS: el artefacto derivado está al día."

      # El contrato que consume el frontend tambien es derivado. Si deja de
      # corresponder al catalogo, el frontend compilaria contra codigos que ya no
      # existen: exactamente la deriva que F006 PR 3.1 tuvo que reconciliar.
      - name: Guard — Frontend permission contract is current
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python scripts/generate_permission_contract.py --check ../docs/phase-006/permission-contract.json

      # Ningún endpoint puede volver a confiar la identidad al cliente.
      - name: Guard — Identity comes from the authenticated principal
        working-directory: backend
        run: |
          # `X-Org-Id` es legítimo: es una preferencia que `resolve_organization_id`
          # valida contra el ámbito del principal. Lo que no puede volver es la
          # identidad del actor por cabecera ni el UUID fijo de respaldo, que atribuían
          # todo lo creado a una organización y un actor únicos.
          if grep -rn 'x_actor_id' --include=*.py app/ | grep -v '__pycache__' | grep -vE '^\s*#'; then
            echo "FAIL: la identidad del actor no puede venir del cliente."
            exit 1
          fi
          FALLBACKS=$(grep -rnE 'return UUID\("[0-9a-f-]{36}"\)' --include=*.py app/ | grep -v '__pycache__' || true)
          if [ -n "$FALLBACKS" ]; then
            echo "FAIL: hay identidades con UUID fijo de respaldo:"
            echo "$FALLBACKS"
            exit 1
          fi
          if grep -rnE '(user|principal)\.role\s*(==|!=)\s*"admin"' --include=*.py app/modules/logistics/ | grep -v '__pycache__' | grep -vE '^\s*#'; then
            echo "FAIL: autorización por nombre de rol de plataforma en el dominio logístico."
            exit 1
          fi
          echo "PASS: identidad y autorización salen del principal y del catálogo."

      # -----------------------------------------------------------------------
      # POSTGRESQL INTEGRATION TESTS — SKIP=0 requerido
      # -----------------------------------------------------------------------
      - name: Run PostgreSQL Integration Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/logistics/inventory/balances -m "postgres" --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_postgres.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_postgres.log

          # Anti-skip check: en CI, SKIP de tests postgres = ERROR
          SKIPPED=$(grep -c "SKIPPED\|SKIP" /tmp/pytest_postgres.log || true)
          PASSED=$(grep -c "PASSED" /tmp/pytest_postgres.log || true)
          FAILED=$(grep -c "FAILED" /tmp/pytest_postgres.log || true)
          SKIPPED=${SKIPPED:-0}
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          echo "PostgreSQL Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: pytest terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.postgres fueron SKIPPED en CI."
            echo "SKIP=0 es requerido en CI. Revisar conftest.py y TEST_DATABASE_URL."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.postgres fallaron."
            exit 1
          fi
          echo "PASS: Todos los tests PostgreSQL pasaron sin SKIP."

      - name: Run Concurrency Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/logistics/inventory/balances -m "concurrency" --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_concurrency.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_concurrency.log

          SKIPPED=$(grep -c "SKIPPED\|SKIP" /tmp/pytest_concurrency.log || true)
          PASSED=$(grep -c "PASSED" /tmp/pytest_concurrency.log || true)
          FAILED=$(grep -c "FAILED" /tmp/pytest_concurrency.log || true)
          SKIPPED=${SKIPPED:-0}
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          echo "Concurrency Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: pytest terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.concurrency fueron SKIPPED en CI."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.concurrency fallaron."
            exit 1
          fi
          echo "PASS: Todos los tests de concurrencia pasaron sin SKIP."

      - name: Run Migration Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/logistics/inventory/balances -m "migration" --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_migration.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_migration.log

          SKIPPED=$(grep -c "SKIPPED\|SKIP" /tmp/pytest_migration.log || true)
          PASSED=$(grep -c "PASSED" /tmp/pytest_migration.log || true)
          FAILED=$(grep -c "FAILED" /tmp/pytest_migration.log || true)
          SKIPPED=${SKIPPED:-0}
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          echo "Migration Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: pytest terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.migration fueron SKIPPED en CI."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: Tests @pytest.mark.migration fallaron."
            exit 1
          fi
          echo "PASS: Todos los tests de migracion pasaron sin SKIP."

      # -----------------------------------------------------------------------
      # FULL PHASE 045 SUITE
      # -----------------------------------------------------------------------
      - name: Run Full Phase 045 Test Suite
        working-directory: backend
        run: |
          pytest tests/logistics/inventory/balances -vv --tb=short -p no:cacheprovider

      # -----------------------------------------------------------------------
      # INVENTORY BALANCES & LEDGER (Phase 044 & 045)
      #
      # No es la suite backend completa: cubre balances y ledger. El nombre
      # anterior, "Full Backend Suite", hacía creer que cualquier test del
      # backend estaba protegido aquí, y no lo estaba.
      # -----------------------------------------------------------------------
      - name: Run Inventory Balances & Ledger Regression Suite
        working-directory: backend
        run: |
          set +e
          pytest tests/logistics/inventory/balances tests/modules/logistics/inventory/ledger/ -m "not ml" --tb=short -p no:cacheprovider 2>&1 | tee /tmp/pytest_full.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_full.log

          # Robust report parser
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_full.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_full.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_full.log | tail -1 || true)

          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "INVENTORY BALANCES & LEDGER SUMMARY"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: la suite de balances y ledger terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: la suite de balances y ledger tiene $FAILED test(s) fallido(s)."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # PDF DOWNLOAD HARDENING — lint, tests and contract gate
      # -----------------------------------------------------------------------
      - name: Run Linter (Ruff) — PDF modules
        working-directory: backend
        run: |
          ruff check \
            app/core/pdf_response.py \
            app/modules/logistics/documents/rendering/filenames.py \
            tests/test_pdf_download_response.py \
            tests/test_pdf_download_http.py \
            tests/test_pdf_download_audit.py \
            tests/test_pdf_download_audit_postgres.py \
            tests/test_pdf_signature_layout.py \
            scripts/audit_pdf_downloads.py \
            --output-format=github

      - name: Run PDF Download Tests
        working-directory: backend
        run: |
          set +e
          pytest \
            tests/test_pdf_download_response.py \
            tests/test_pdf_download_http.py \
            tests/test_pdf_download_audit.py \
            tests/test_pdf_signature_layout.py \
            --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_pdf.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_pdf.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_pdf.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_pdf.log | tail -1 || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "==================================="
          echo "PDF DOWNLOAD SUITE"
          echo "PASSED : $PASSED"
          echo "FAILED : $FAILED"
          echo "SKIPPED: $SKIPPED"
          echo "==================================="

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "FAIL: PDF suite terminó con código $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED test(s) PDF fallido(s)."
            exit 1
          fi
          # Un PDF test saltado esconde exactamente el tipo de regresión que
          # esta suite existe para detectar.
          if [ "$SKIPPED" -gt 0 ]; then
            echo "FAIL: $SKIPPED test(s) PDF SKIPPED. SKIP=0 es requerido."
            exit 1
          fi
          if [ "$PASSED" -lt 77 ]; then
            echo "FAIL: sólo $PASSED tests PDF ejecutados; se esperan >= 77."
            exit 1
          fi
          echo "PASS: suite PDF completa sin fallos ni skips."

      - name: Run PDF PostgreSQL Audit Integration Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/test_pdf_download_audit_postgres.py \
            -m "pdf_postgres" --tb=short -v -p no:cacheprovider \
            2>&1 | tee /tmp/pytest_pdf_postgres.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_pdf_postgres.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_pdf_postgres.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_pdf_postgres.log | tail -1 || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "PDF PostgreSQL Audit Integration Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"
          if [ "$PYTEST_EXIT" -ne 0 ]; then
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -ne 0 ] || [ "$SKIPPED" -ne 0 ]; then
            echo "FAIL: PDF PostgreSQL gate requires FAILED=0 and SKIPPED=0."
            exit 1
          fi
          if [ "$PASSED" -lt 11 ]; then
            echo "FAIL: expected at least 11 real PostgreSQL PDF tests."
            exit 1
          fi
          echo "PASS: PDF PostgreSQL audit invariants verified on the real service."

      - name: Verify PDF Download Contract (OpenAPI)
        working-directory: backend
        run: |
          # Offline: importa la app local, sin red ni credenciales.
          python scripts/audit_pdf_downloads.py --check --min-operations 33

      # -----------------------------------------------------------------------
      # AUDIT EVENTS HTTP REGRESSION GATE
      # -----------------------------------------------------------------------
      - name: Run Audit HTTP Regression Tests
        working-directory: backend
        run: |
          set +e
          pytest tests/test_logistics_phase007.py --tb=short -v -p no:cacheprovider 2>&1 | tee /tmp/pytest_audit.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          cat /tmp/pytest_audit.log

          PASSED=$(grep -oP '\d+(?= passed)' /tmp/pytest_audit.log | tail -1 || true)
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/pytest_audit.log | tail -1 || true)
          SKIPPED=$(grep -oP '\d+(?= skipped)' /tmp/pytest_audit.log | tail -1 || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          echo "Audit HTTP Regression Tests — PASSED: $PASSED | FAILED: $FAILED | SKIPPED: $SKIPPED"
          if [ "$PYTEST_EXIT" -ne 0 ]; then
            exit "$PYTEST_EXIT"
          fi
          if [ "$FAILED" -ne 0 ] || [ "$SKIPPED" -ne 0 ]; then
            echo "FAIL: Audit regression gate requires FAILED=0 and SKIPPED=0."
            exit 1
          fi
          echo "PASS: Audit HTTP regression tests verified."

      # -----------------------------------------------------------------------
      # OPENAPI / IMPORT SMOKE
      # -----------------------------------------------------------------------
      - name: Verify OpenAPI Schema and Import
        working-directory: backend
        run: |
          python -c "
          import os
          os.environ.setdefault('APP_ENV', 'testing')
          from app.main import app
          schema = app.openapi()
          paths = list(schema['paths'].keys())
          base = '/api/logistics/inventory/balances'
          balance_paths = [p for p in paths if base in p]
          v1_paths = [p for p in paths if '/api/v1' in p]
          print(f'BALANCES_PATHS ({len(balance_paths)}): {balance_paths}')
          print(f'API_V1_PATHS (must be 0): {v1_paths}')
          assert len(balance_paths) > 0, f'No balance paths found in OpenAPI. All paths: {paths}'
          assert len(v1_paths) == 0, f'Found /api/v1 paths — should not exist: {v1_paths}'
          print('PASS: OpenAPI schema is correct.')
          "

      # -----------------------------------------------------------------------
      # ALEMBIC HEADS / CURRENT (final check)
      # -----------------------------------------------------------------------
      - name: Final Alembic Validation
        working-directory: backend
        run: |
          echo "=== alembic heads ==="
          python -m alembic heads
          echo "=== alembic current ==="
          python -m alembic current
          echo "=== alembic history --indicate-current ==="
          python -m alembic history --indicate-current | head -10

  docker-build:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Test Only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: backend:ci-test
