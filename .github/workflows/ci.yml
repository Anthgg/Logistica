name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: continuous_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: Run Linter (Ruff)
        run: |
          cd backend
          ruff check .

      - name: Run Type Checker (MyPy)
        run: |
          cd backend
          mypy app --ignore-missing-imports || true

      - name: Run Unit & Integration Tests
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
          COOKIE_SECURE: false
        run: |
          cd backend
          pytest -m "not ml" --tb=short

      - name: Verify OpenAPI Schema Generation
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
        run: |
          cd backend
          python -c "from app.main import app; print('OpenAPI paths:', len(app.openapi()['paths']))"

  docker-build:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Test Only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: backend:ci-test
