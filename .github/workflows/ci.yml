name: CI Pipeline

on:
  push:
    branches: [ main, develop, feat/phase-045-inventory-balances ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: continuous_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx psycopg[binary]

      - name: Run Linter (Ruff)
        run: |
          cd backend
          ruff check .

      - name: Run Type Checker (MyPy)
        run: |
          cd backend
          mypy app --ignore-missing-imports || true

      - name: Run Alembic Migrations (PostgreSQL TEST)
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
          COOKIE_SECURE: false
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run Unit Tests (sin PostgreSQL requerido)
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
          COOKIE_SECURE: false
        run: |
          cd backend
          pytest -m "not ml and not postgres and not concurrency and not migration" --tb=short -v

      - name: Run PostgreSQL Integration Tests (Fase 045)
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
          COOKIE_SECURE: false
        run: |
          cd backend
          pytest -m "postgres" --tb=short -v
          # FAIL HARD: si tests PostgreSQL fallan, el workflow falla (no || true)

      - name: Run Concurrency Tests (Fase 045)
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
          COOKIE_SECURE: false
        run: |
          cd backend
          pytest -m "concurrency" --tb=short -v
          # FAIL HARD: no || true

      - name: Run Migration Cycle Tests (Fase 045)
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
          COOKIE_SECURE: false
        run: |
          cd backend
          pytest -m "migration" --tb=short -v

      - name: Run Security HTTP Tests
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
          COOKIE_SECURE: false
        run: |
          cd backend
          pytest -m "security" --tb=short -v

      - name: Run Full Phase 045 Suite
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
          COOKIE_SECURE: false
        run: |
          cd backend
          pytest tests/logistics/inventory/balances -vv --tb=short

      - name: Run Full Backend Suite (not ml)
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
          COOKIE_SECURE: false
        run: |
          cd backend
          pytest -m "not ml" --tb=short

      - name: Verify OpenAPI Schema Generation
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/continuous_auth_test
          SECRET_KEY: test-only-secret-key-must-be-min-16-chars
        run: |
          cd backend
          python -c "
          from app.main import app
          schema = app.openapi()
          paths = list(schema['paths'].keys())
          balance_paths = [p for p in paths if '/api/logistics/inventory/balances' in p]
          print('BALANCES_PATHS:', balance_paths)
          print('OpenAPI total paths:', len(paths))
          assert len(balance_paths) > 0, 'No se encontraron rutas de balances en OpenAPI'
          "

  docker-build:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Test Only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: backend:ci-test
