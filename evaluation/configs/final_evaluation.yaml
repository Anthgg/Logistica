schema_version: "1.0"
dataset_version: pilot-v0.1.0
protocol_version: pilot-protocol-v0.1.0

paths:
  frozen_test_manifest: data/manifests/frozen_test_manifest.parquet
  frozen_test_checksum: data/manifests/frozen_test_manifest.sha256
  frozen_test_metadata: data/manifests/frozen_test_metadata.json
  integration_approval: models/registry/integration_approval.json
  model_registry: models/registry/model_registry.json
  fusion_config: models/fusion/fusion_config.json
  normalization_config: models/fusion/score_normalization.json
  test_data_root: data/processed
  output_directory: data/reports/final
  development_manifests:
    - data/manifests/facial_identity_manifest.parquet
    - data/manifests/facial_pad_manifest.parquet
    - data/manifests/behavioral_manifest.parquet

approved_versions:
  facial: pending-approval
  pad: pending-approval
  behavioral: pending-approval
  fusion: pending-approval
  normalization: pending-approval

random_seed: 42
confidence_level: 0.95
bootstrap_iterations: 2000
latency:
  warmup_iterations: 5
  measurement_iterations: 30
  concurrency_levels:
    - 1
    - 5
    - 10

input_schema:
  row_id: sample_id
  split: split
  participant_id: participant_id
  session_id: session_id
  timestamp: captured_at
  image_path: relative_path
  sample_checksum: checksum
  facial_label: facial_label
  pad_label: pad_label
  behavioral_label: behavioral_label
  fusion_label: fusion_label
  scenario: scenario
  attack_type: attack_type
  source_device: source_device
  illumination: illumination
  condition: condition
  pretest_detected: pretest_detected
  pretest_latency_ms: pretest_latency_ms
  pretest_false_alert: pretest_false_alert

ablation_configurations:
  - facial
  - pad
  - behavioral
  - facial+pad
  - facial+behavioral
  - pad+behavioral
  - facial+pad+behavioral+hysteresis
  - facial+pad+behavioral+no_hysteresis

statistical_tests:
  - mcnemar
  - paired_t_or_wilcoxon
  - friedman
  - holm
