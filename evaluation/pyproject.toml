[project]
name = "continuous-authentication-final-evaluation"
version = "0.1.0"
description = "Evaluación final controlada y reproducible de la tesis"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-q -ra"

[tool.ruff]
line-length = 100
target-version = "py311"
